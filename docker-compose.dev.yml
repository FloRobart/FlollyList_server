# Development only: the API runs from the local sources with nodemon, and reaches the development
# database of flollylist-database through the flollylist-net network.
# Start that database first, from the folder of flollylist-database:
#   docker compose -f docker-compose.dev.yml up -d

services:
  flollylist-api:
    image: node:24-alpine
    working_dir: /app
    env_file: .env
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # Inside the container, "localhost" would be the container itself
      AUTH_APP_URL: http://host.docker.internal:26001
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./:/app/
    command: ["npm", "run", "dev"]
    ports:
      - 127.0.0.1:${APP_PORT:-26005}:80
    networks:
      - flollylist-net
    # Same user as the files of the sources, which nodemon only reads
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    security_opt:
      - no-new-privileges:true

networks:
  # Created by the docker-compose.dev.yml of flollylist-database
  flollylist-net:
    name: flollylist-net
    external: true
